name: Cimory Tor Scraper (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Added a 60-minute timeout so it doesn't run forever if it hangs
    timeout-minutes: 60 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 1. Install System Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor --no-install-recommends
      
      - name: 2. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl instaloader stem pysocks

      - name: 3. Start Tor Service
        run: |
          echo "ControlPort 9051" | sudo tee -a /etc/tor/torrc
          echo "CookieAuthentication 0" | sudo tee -a /etc/tor/torrc
          sudo service tor restart
          # Increased wait time to ensure Tor fully connects
          sleep 20 

      - name: 4. Run Scraper
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          INSTA_USER: ${{ secrets.INSTA_USER }}
          INSTA_PASS: ${{ secrets.INSTA_PASS }}
        run: python cimory_insta_tracker_5_0.py
